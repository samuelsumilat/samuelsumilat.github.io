<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Panel - Data Undangan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #1ABC9C;
            --primary-dark: #16A085;
            --secondary-color: #F1C40F;
            --neutral-light: #FFFFFF;
            --neutral-dark: #34495E;
            --accent-color: #E74C3C;
            --shadow-color: rgba(0, 0, 0, 0.1);
        }
        body {
            background-color: #f5f7f8;
            padding: 20px;
            font-family: Arial, sans-serif;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            color: white;
            padding: 25px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px var(--shadow-color);
        }
        .header h1 {
            margin: 0;
            font-size: 2.2rem;
        }
        .section-card {
            background: white;
            border-radius: 12px;
            padding: 22px;
            margin-bottom: 25px;
            box-shadow: 0 4px 10px var(--shadow-color);
        }
        .section-title {
            background: var(--neutral-dark);
            color: white;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 1.15rem;
        }
        .sub-title {
            color: var(--primary-dark);
            font-weight: bold;
            margin-top: 20px;
            margin-bottom: 15px;
            border-bottom: 2px solid #eee;
            padding-bottom: 8px;
        }
        label {
            font-weight: 600;
            margin-bottom: 6px;
        }
        textarea {
            resize: vertical;
        }
        .btn-primary {
            background-color: var(--primary-color);
            border: none;
        }
        .btn-primary:hover {
            background-color: var(--primary-dark);
        }
        .btn-save {
            font-size: 1.1rem;
            padding: 12px 25px;
        }
        .alert-box {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            min-width: 280px;
            max-width: 90%;
        }
        .sticky-buttons {
            position: sticky;
            bottom: 15px;
            z-index: 100;
            background: rgba(255,255,255,0.95);
            padding: 12px;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.15);
            margin-bottom: 20px;
        }
        .loading {
            opacity: 0.6;
            pointer-events: none;
        }
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            .header h1 {
                font-size: 1.7rem;
            }
            .section-card {
                padding: 15px;
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Control Panel</h1>
        <p class="mb-0">Pengaturan Data Undangan</p>
    </div>
    
    <div class="text-center mb-4 box">
            <p>The Wedding of</p>
            <h2><span class="groom"></span> & <span class="bride"></span></h2>
            <h5 class="tanggal-acara1"></h5>
        </div>

    <div id="alert" class="alert alert-success alert-box" style="display:none;"></div>

    <div class="sticky-buttons">
        <div class="d-flex gap-2 flex-wrap justify-content-center">
            <button type="button" class="btn btn-secondary" onclick="loadDataTxt()">🔄 Muat Ulang</button>
            <button type="button" class="btn btn-primary btn-save" onclick="saveDataTxt()">💾 Simpan Semua Perubahan</button>
        </div>
    </div>

    <div class="section-card">
        <div class="section-title">💍 Data Mempelai</div>
        <h5 class="sub-title">Mempelai Pria</h5>
        <div class="row g-3">
            <div class="col-md-6">
                <label>Nama Mempelai Pria</label>
                <input type="text" id="groom" class="form-control">
            </div>
            <div class="col-md-6">
                <label>Anak Ke</label>
                <input type="text" id="groom-anak-ke" class="form-control">
            </div>
            <div class="col-md-6">
                <label>Nama Ayah</label>
                <input type="text" id="Ayah-groom" class="form-control">
            </div>
            <div class="col-md-6">
                <label>Nama Ibu</label>
                <input type="text" id="Ibu-groom" class="form-control">
            </div>
            <div class="col-12">
                <label>Alamat</label>
                <textarea id="alamat-groom" class="form-control" rows="2"></textarea>
            </div>
        </div>
        <h5 class="sub-title">Mempelai Wanita</h5>
        <div class="row g-3">
            <div class="col-md-6">
                <label>Nama Mempelai Wanita</label>
                <input type="text" id="bride" class="form-control">
            </div>
            <div class="col-md-6">
                <label>Anak Ke</label>
                <input type="text" id="bride-anak-ke" class="form-control">
            </div>
            <div class="col-md-6">
                <label>Nama Ayah</label>
                <input type="text" id="Ayah-bride" class="form-control">
            </div>
            <div class="col-md-6">
                <label>Nama Ibu</label>
                <input type="text" id="Ibu-bride" class="form-control">
            </div>
            <div class="col-12">
                <label>Alamat</label>
                <textarea id="alamat-bride" class="form-control" rows="2"></textarea>
            </div>
        </div>
    </div>

    <div class="section-card">
        <div class="section-title">💬 Quotes</div>
        <div class="row g-3">
            <div class="col-12">
                <label>Quotes 1</label>
                <textarea id="quotes1" class="form-control" rows="3"></textarea>
            </div>
            <div class="col-md-6">
                <label>Sumber Quotes 1</label>
                <input type="text" id="sumber-quotes1" class="form-control">
            </div>
            <div class="col-12">
                <label>Quotes 2</label>
                <textarea id="quotes2" class="form-control" rows="3"></textarea>
            </div>
            <div class="col-md-6">
                <label>Sumber Quotes 2</label>
                <input type="text" id="sumber-quotes2" class="form-control">
            </div>
        </div>
    </div>

    <div class="section-card">
        <div class="section-title">📅 Akad & Resepsi</div>
        <h5 class="sub-title">Akad Nikah</h5>
        <div class="row g-3">
            <div class="col-md-6">
                <label>Nama Acara</label>
                <input type="text" id="nama-acara1" class="form-control">
            </div>
            <div class="col-md-6">
                <label>Tanggal</label>
                <input type="text" id="tanggal-acara1" class="form-control">
            </div>
            <div class="col-md-6">
                <label>Waktu</label>
                <input type="text" id="waktu-acara1" class="form-control">
            </div>
            <div class="col-md-6">
                <label>Tempat</label>
                <input type="text" id="tempat-acara1" class="form-control">
            </div>
            <div class="col-12">
                <label>URL Google Maps</label>
                <input type="url" id="url-1" class="form-control">
            </div>
        </div>
        <h5 class="sub-title">Resepsi Pernikahan</h5>
        <div class="row g-3">
            <div class="col-md-6">
                <label>Nama Acara</label>
                <input type="text" id="nama-acara2" class="form-control">
            </div>
            <div class="col-md-6">
                <label>Tanggal</label>
                <input type="text" id="tanggal-acara2" class="form-control">
            </div>
            <div class="col-md-6">
                <label>Waktu</label>
                <input type="text" id="waktu-acara2" class="form-control">
            </div>
            <div class="col-md-6">
                <label>Tempat</label>
                <input type="text" id="tempat-acara2" class="form-control">
            </div>
            <div class="col-12">
                <label>URL Google Maps</label>
                <input type="url" id="url-2" class="form-control">
            </div>
            <div class="col-12">
                <label>URL Kalender</label>
                <input type="text" id="url-3" class="form-control">
            </div>
        </div>
    </div>

    <div class="section-card">
        <div class="section-title">❤️ Kisah Kami</div>
        <div id="story-container"></div>
    </div>

    <div class="section-card">
        <div class="section-title">🎁 Gift / Rekening</div>
        <div class="row g-3">
            <div class="col-md-6">
                <label>Gift 01 - Bank</label>
                <input type="text" id="gift-01" class="form-control">
            </div>
            <div class="col-md-6">
                <label>Nomor Rekening 1</label>
                <input type="text" id="rekening-1" class="form-control">
            </div>
            <div class="col-md-6">
                <label>Gift 02 - Bank</label>
                <input type="text" id="gift-02" class="form-control">
            </div>
            <div class="col-md-6">
                <label>Nomor Rekening 2</label>
                <input type="text" id="rekening-2" class="form-control">
            </div>
            <div class="col-md-6">
                <label>Gift 03 - Bank / E-Wallet</label>
                <input type="text" id="gift-03" class="form-control">
            </div>
            <div class="col-md-6">
                <label>Nomor Rekening 3</label>
                <input type="text" id="rekening-3" class="form-control">
            </div>
            <div class="col-md-6">
                <label>Gift 04 - Bank / E-Wallet</label>
                <input type="text" id="gift-04" class="form-control">
            </div>
            <div class="col-md-6">
                <label>Nomor Rekening 4</label>
                <input type="text" id="rekening-4" class="form-control">
            </div>
        </div>
    </div>

    <div class="text-center mb-5">
        <button type="button" class="btn btn-secondary me-2" onclick="loadDataTxt()">🔄 Muat Ulang</button>
        <button type="button" class="btn btn-primary btn-save" onclick="saveDataTxt()">💾 Simpan Perubahan</button>
    </div>

    <script>
        let githubToken = '';
        let repoOwner = '';
        let repoName = '';
        let originalDataTxt = '';

        function showAlert(message, type = 'success') {
            const alertBox = document.getElementById('alert');
            alertBox.className = `alert alert-${type} alert-box`;
            alertBox.textContent = message;
            alertBox.style.display = 'block';
            setTimeout(() => {
                alertBox.style.display = 'none';
            }, 4000);
        }

        async function loadToken() {
            try {
                const response = await fetch('data-input/data.txt');
                if (!response.ok) {
                    throw new Error('Gagal mengambil data.txt');
                }
                const text = await response.text();
                const tokenLine = text.split(/\r?\n/).find(line => line.trim().startsWith('token:'));
                if (!tokenLine) {
                    throw new Error('Baris token tidak ditemukan');
                }
                const tokenUrl = tokenLine.substring(tokenLine.indexOf('token:') + 6).trim();
                const tokenResponse = await fetch(tokenUrl);
                if (!tokenResponse.ok) {
                    throw new Error('Gagal mengambil token.txt');
                }
                const tokenText = await tokenResponse.text();
                const config = tokenText.split(/\r?\n/).map(line => line.trim()).filter(Boolean);
                githubToken = config[0] || '';
                repoOwner = config[1] || '';
                repoName = config[2] || '';
                if (!githubToken || !repoOwner || !repoName) {
                    throw new Error('Token, owner, atau repo tidak lengkap');
                }
                console.log('GitHub Owner:', repoOwner);
                console.log('GitHub Repository:', repoName);
            } catch (error) {
                console.error('Gagal memuat konfigurasi:', error);
                showAlert('Gagal memuat konfigurasi GitHub.', 'danger');
                throw error;
            }
        }

        function decodeBase64UTF8(base64) {
            const binary = atob(base64.replace(/\s/g, ''));
            const bytes = Uint8Array.from(binary, char => char.charCodeAt(0));
            return new TextDecoder('utf-8').decode(bytes);
        }

        function encodeBase64UTF8(text) {
            const bytes = new TextEncoder().encode(text);
            let binary = '';
            bytes.forEach(byte => {
                binary += String.fromCharCode(byte);
            });
            return btoa(binary);
        }

        function parseData(text) {
            const result = {};
            const lines = text.split(/\r?\n/);
            lines.forEach(line => {
                const trimmed = line.trim();
                if (!trimmed || trimmed.startsWith('#') || trimmed.startsWith('==========') || trimmed.startsWith('("') || trimmed.startsWith('alamat url')) {
                    return;
                }
                const separator = trimmed.indexOf(':');
                if (separator === -1) return;
                const key = trimmed.substring(0, separator).trim();
                const value = trimmed.substring(separator + 1).trim();
                result[key] = value;
            });
            return result;
        }

        function setValue(key, value) {
            const element = document.getElementById(key);
            if (element) {
                element.value = value || '';
            }
        }

        function getValue(key) {
            const element = document.getElementById(key);
            return element ? element.value.trim() : '';
        }

        function createStoryFields() {
            const container = document.getElementById('story-container');
            container.innerHTML = '';
            for (let i = 1; i <= 4; i++) {
                container.innerHTML += `
                    <div class="border rounded p-3 mb-4">
                        <h6 class="fw-bold">Kisah ${i}</h6>
                        <div class="row g-3">
                            <div class="col-md-4">
                                <label>Waktu</label>
                                <input type="text" id="waktu-cerita-${i}" class="form-control">
                            </div>
                            <div class="col-md-8">
                                <label>Judul</label>
                                <input type="text" id="judul-cerita-${i}" class="form-control">
                            </div>
                            <div class="col-12">
                                <label>Isi Cerita</label>
                                <textarea id="isi-cerita-${i}" class="form-control" rows="4"></textarea>
                            </div>
                        </div>
                    </div>
                `;
            }
        }

        async function loadDataTxt() {
            try {
                if (!githubToken || !repoOwner || !repoName) {
                    await loadToken();
                }
                const filePath = 'data-input/data.txt';
                const response = await fetch(`https://api.github.com/repos/${repoOwner}/${repoName}/contents/${filePath}`, {
                    headers: {
                        'Authorization': `token ${githubToken}`,
                        'Accept': 'application/vnd.github+json'
                    }
                });
                if (!response.ok) {
                    throw new Error('Gagal mengambil data.txt dari GitHub');
                }
                const data = await response.json();
                originalDataTxt = decodeBase64UTF8(data.content);
                const parsed = parseData(originalDataTxt);

                const keys = [
                    'groom', 'groom-anak-ke', 'Ayah-groom', 'Ibu-groom', 'alamat-groom',
                    'bride', 'bride-anak-ke', 'Ayah-bride', 'Ibu-bride', 'alamat-bride',
                    'quotes1', 'sumber-quotes1', 'quotes2', 'sumber-quotes2',
                    'nama-acara1', 'tanggal-acara1', 'waktu-acara1', 'tempat-acara1', 'url-1',
                    'nama-acara2', 'tanggal-acara2', 'waktu-acara2', 'tempat-acara2', 'url-2', 'url-3'
                ];
                keys.forEach(key => setValue(key, parsed[key]));

                for (let i = 1; i <= 4; i++) {
                    setValue(`waktu-cerita-${i}`, parsed[`waktu-cerita-${i}`]);
                    setValue(`judul-cerita-${i}`, parsed[`judul-cerita-${i}`]);
                    setValue(`isi-cerita-${i}`, parsed[`isi-cerita-${i}`]);
                }
                for (let i = 1; i <= 4; i++) {
                    const gift = i.toString().padStart(2, '0');
                    setValue(`gift-${gift}`, parsed[`gift-${gift}`]);
                    setValue(`rekening-${i}`, parsed[`rekening-${i}`]);
                }

                showAlert('Data undangan berhasil dimuat.');
            } catch (error) {
                console.error('Error loadDataTxt:', error);
                showAlert('Gagal memuat data undangan.', 'danger');
            }
        }

        function updateDataLine(lines, key, value) {
            const index = lines.findIndex(line => line.trim().startsWith(key + ':'));
            if (index !== -1) {
                lines[index] = `${key}: ${value}`;
            } else {
                console.warn(`Key tidak ditemukan: ${key}`);
            }
        }

        async function saveDataTxt() {
            if (!githubToken || !repoOwner || !repoName) {
                showAlert('Konfigurasi GitHub belum dimuat.', 'danger');
                return;
            }
            if (!confirm('Apakah Anda yakin ingin menyimpan semua perubahan ke data.txt?')) {
                return;
            }
            try {
                const filePath = 'data-input/data.txt';
                const response = await fetch(`https://api.github.com/repos/${repoOwner}/${repoName}/contents/${filePath}`, {
                    headers: {
                        'Authorization': `token ${githubToken}`,
                        'Accept': 'application/vnd.github+json'
                    }
                });
                if (!response.ok) {
                    throw new Error('Gagal mengambil data.txt');
                }
                const githubData = await response.json();
                let lines = decodeBase64UTF8(githubData.content).split(/\r?\n/);

                const keys = [
                    'groom', 'groom-anak-ke', 'Ayah-groom', 'Ibu-groom', 'alamat-groom',
                    'bride', 'bride-anak-ke', 'Ayah-bride', 'Ibu-bride', 'alamat-bride',
                    'quotes1', 'sumber-quotes1', 'quotes2', 'sumber-quotes2',
                    'nama-acara1', 'tanggal-acara1', 'waktu-acara1', 'tempat-acara1',
                    'nama-acara2', 'tanggal-acara2', 'waktu-acara2', 'tempat-acara2',
                    'url-1', 'url-2', 'url-3'
                ];
                keys.forEach(key => updateDataLine(lines, key, getValue(key)));

                for (let i = 1; i <= 4; i++) {
                    updateDataLine(lines, `waktu-cerita-${i}`, getValue(`waktu-cerita-${i}`));
                    updateDataLine(lines, `judul-cerita-${i}`, getValue(`judul-cerita-${i}`));
                    updateDataLine(lines, `isi-cerita-${i}`, getValue(`isi-cerita-${i}`));
                }
                for (let i = 1; i <= 4; i++) {
                    const gift = i.toString().padStart(2, '0');
                    updateDataLine(lines, `gift-${gift}`, getValue(`gift-${gift}`));
                    updateDataLine(lines, `rekening-${i}`, getValue(`rekening-${i}`));
                }

                const newContent = lines.join('\n');
                const updateResponse = await fetch(`https://api.github.com/repos/${repoOwner}/${repoName}/contents/${filePath}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${githubToken}`,
                        'Content-Type': 'application/json',
                        'Accept': 'application/vnd.github+json'
                    },
                    body: JSON.stringify({
                        message: 'Memperbarui data undangan melalui Control Panel',
                        content: encodeBase64UTF8(newContent),
                        sha: githubData.sha
                    })
                });
                if (!updateResponse.ok) {
                    const errorData = await updateResponse.json();
                    console.error(errorData);
                    throw new Error('GitHub gagal menyimpan data.txt');
                }

                originalDataTxt = newContent;
                showAlert('✅ Semua perubahan berhasil disimpan ke GitHub!');
            } catch (error) {
                console.error('Error saveDataTxt:', error);
                showAlert('❌ Gagal menyimpan perubahan ke GitHub.', 'danger');
            }
        }

        document.addEventListener('DOMContentLoaded', async function() {
            createStoryFields();
            try {
                await loadToken();
                await loadDataTxt();
            } catch (error) {
                console.error(error);
            }
        });
    </script>
    
    <script src="repo/data-input.js"></script>

</body>
</html>
